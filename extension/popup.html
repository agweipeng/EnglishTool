<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>English Trainer Quick-Capture</title>
<style>
  body { font: 14px -apple-system, sans-serif; padding: 14px; min-width: 260px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
  input[type="text"] { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 7px 12px; border: 1px solid #4f7cff; background: #4f7cff; color: white; border-radius: 6px; cursor: pointer; }
  .ok { color: green; margin-top: 6px; font-size: 12px; }
  .hint { color: #888; font-size: 12px; margin-top: 8px; line-height: 1.4; }
</style>
</head>
<body>
  <h1>English Trainer Quick-Capture</h1>
  <label>Trainer URL
    <input type="text" id="urlInput" placeholder="http://localhost:8000/" />
  </label>
  <button id="saveBtn">Save</button>
  <span class="ok" id="okMsg"></span>
  <p class="hint">Highlight any word on a webpage, right-click → <b>Send "..." to English Trainer</b>. A new tab opens with the word and surrounding sentence pre-filled.</p>
<script src="popup.js"></script>
</body>
</html>
