name: Daily News

on:
  schedule:
    # Runs daily at 06:00 UTC (14:00 SGT / China)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # A hung news site must not hold the job (and the concurrency queue) for hours
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch AI news
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-news.mjs

      # New articles from The Conversation (CC BY-ND) for the Reader. A failure keeps
      # yesterday's articles and must not stop the AI news update.
      - name: Fetch Reader articles
        continue-on-error: true
        run: node scripts/import-news.mjs conversation

      - name: Commit news if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json books/the-conversation books/catalog.json books/catalog.js
          if git diff --cached --quiet; then
            echo "News unchanged — skipping commit"
            exit 0
          fi
          git commit -m "chore(news): refresh DailyNews and Reader articles $(date -u +'%Y-%m-%d')"
          # Someone may push while this job runs; retry so the day's news is not lost.
          # During a rebase "theirs" is this job's own commit, so on a conflict the
          # freshly fetched news.json and Reader articles win over the older copy.
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Could not push the news after 3 tries" >&2
          exit 1
