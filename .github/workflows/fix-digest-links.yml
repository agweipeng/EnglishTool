name: Build Digest Index

# The external digest publisher (stratbrain machines) overwrites
# digests/index.html with only the latest issue per category, and with
# links like href="digests/<slug>/<date>.html" that double the path
# (/digests/digests/...) and 404 when served at /EnglishTool/digests/.
#
# This workflow regenerates digests/index.html from every dated file on
# disk: ALL issues per category, newest first, with correct relative
# links. Runs on any push under digests/ and commits if the index changed.
#
# Loop-safe: a push made with the default GITHUB_TOKEN does NOT trigger
# another workflow run, so the regeneration commit cannot recurse.

on:
  push:
    branches: [main]
    paths:
      - 'digests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-digest-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild digest archive index (all days)
        run: node scripts/build-digest-index.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- digests/; then
            echo "Digests already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/
          git commit -m "chore(digests): rebuild index + light theme for all issues"
          git push
