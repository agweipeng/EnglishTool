name: Build Digest Index

# The external digest publisher (stratbrain machines) overwrites
# digests/index.html with only the latest issue per category, and with
# links like href="digests/<slug>/<date>.html" that double the path
# (/digests/digests/...) and 404 when served at /EnglishTool/digests/.
#
# This workflow regenerates digests/index.html from every dated file on
# disk: ALL issues per category, newest first, with correct relative
# links. Runs on any push under digests/ and commits if the index changed.
#
# Loop-safe: a push made with the default GITHUB_TOKEN does NOT trigger
# another workflow run, so the regeneration commit cannot recurse.

on:
  push:
    branches: [main]
    paths:
      - 'digests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-digest-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Rebuilding the index takes seconds; anything longer is stuck
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild digest archive index (all days)
        run: node scripts/build-digest-index.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- digests/; then
            echo "Digests already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/
          git commit -m "chore(digests): rebuild index + light theme for all issues"
          # A digest may be published while this runs; retry so the rebuild still lands.
          # During a rebase "theirs" is this job's own commit, so on a conflict the
          # rebuilt index wins. A digest pushed meanwhile is not lost: its own push
          # starts another run of this workflow (queued by the concurrency group).
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Could not push the rebuilt index after 3 tries" >&2
          exit 1
