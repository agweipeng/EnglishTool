name: Fix Digest Index Links

# The external digest publisher (stratbrain machines) overwrites
# digests/index.html with links like href="digests/<slug>/<date>.html".
# Because the index is served at /EnglishTool/digests/, that doubles the
# path (/digests/digests/...) and 404s. This workflow strips the
# redundant prefix automatically on every push that touches the index.
#
# Loop-safe: a push made with the default GITHUB_TOKEN does NOT trigger
# another workflow run, so the auto-fix commit cannot recurse.

on:
  push:
    branches: [main]
    paths:
      - 'digests/index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-digest-links
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip redundant digests/ prefix
        run: sed -i 's|href="digests/|href="|g' digests/index.html
      - name: Commit if changed
        run: |
          if git diff --quiet digests/index.html; then
            echo "Index links already correct — nothing to fix."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/index.html
          git commit -m "fix(digests): auto-strip doubled digests/ prefix in index links"
          git push
